<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,600,0,0&icon_names=keyboard_arrow_down" />
        <title>Color Picker V1</title>
    </head>
    <body>

        <section class="header">

            <input type="color" class="color-picker"></input>

            <div class="color-scheme" id="color-scheme">
                <div class="color-scheme-default">
                    <div class="monochrome">Monochrome</div>
                    <span class="material-symbols-outlined">keyboard_arrow_down</span>
                </div>
                <ul class="color-scheme-list">
                    <li class="monochrome-dark">Monochrome-dark</li>
                    <li class="monochrome-light">Monochrome-light</li>
                    <li class="analogic">Analogic</li>
                    <li class="complement">Complement</li>
                    <li class="analogic-complement">Analogic-complement</li>
                    <li class="triad">Triad</li>
                    <li class="quad">Quad</li>
                </ul>
            </div>

            <button class="get-color">Get color scheme</button>

        </section>

        <section class="main">

            <div class="color-list">
                <div class="color-box color1"></div>
                <div class="color-box color2"></div>
                <div class="color-box color3"></div>
                <div class="color-box color4"></div>
                <div class="color-box color5"></div>
            </div>

        </section>

        <section class="footer">

            <div class="hex-list">
                <div class="hex">test</div>
                <div class="hex">test</div>
                <div class="hex">test</div>
                <div class="hex">test</div>
                <div class="hex">test</div>
            </div>

        </section>


        <script src="script.js"></script>
        
    </body>
</html>
